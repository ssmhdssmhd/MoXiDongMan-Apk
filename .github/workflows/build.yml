name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Purge jsDelivr cache
        run: |
          curl -s "https://purge.jsdelivr.net/gh/ssmhdssmhd/MoXiDongMan-Apk@main/appUpdate.json" || true
          curl -s "https://purge.jsdelivr.net/gh/ssmhdssmhd/MoXiDongMan-Apk@main/sources/all_sources.json" || true
          for i in 01 02 03 04 05 06 07 08; do curl -s "https://purge.jsdelivr.net/gh/ssmhdssmhd/MoXiDongMan-Apk@main/wallpapers/wallpaper.$i.jpg" || true; done

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download Apktool
        run: |
          wget -q https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar -O apktool.jar
          echo "apktool 下载完成"

      - name: Build APK (apktool)
        run: |
          java -jar apktool.jar b . -o app-unsigned.apk
          ls -la app-unsigned.apk

      - name: Sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # 恢复签名密钥
          echo "$KEYSTORE_BASE64" | base64 -d > moxi.keystore

          # 使用预装的 Android build-tools
          BUILD_TOOLS=$(ls -d ${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools/* 2>/dev/null | sort -V | tail -1)
          echo "使用 build-tools: $BUILD_TOOLS"

          # 对齐
          "$BUILD_TOOLS/zipalign" -f -p 4 app-unsigned.apk app-aligned.apk

          # 生成时间戳 文件名: 沫兮动漫.v2.4.11_YYYYMMDDHHMM.apk
          TIMESTAMP=$(date +%Y%m%d%H%M)
          APK_NAME="沫兮动漫.v2.4.11_${TIMESTAMP}.apk"

          # 签名
          "$BUILD_TOOLS/apksigner" sign \
            --ks moxi.keystore \
            --ks-pass pass:"$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass pass:"$KEY_PASSWORD" \
            --out "$APK_NAME" \
            app-aligned.apk

          # 验证签名
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK_NAME"

          echo "APK_NAME=$APK_NAME" >> $GITHUB_ENV
          ls -la "$APK_NAME"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: moxi-dongman-apk
          path: ${{ env.APK_NAME }}

      - name: Prepare release asset
        run: |
          cp "$APK_NAME" "moxi.dongman.v2.4.11.apk"
          ls -la moxi.dongman.v2.4.11.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.4.11
          name: 沫兮动漫 v2.4.11
          body: |
            ## 沫兮动漫 v2.4.11

            - 侧边栏版本入口移至设置页「清理缓存」上方，显示当前版本与最新版本
            - 点击版本行即可检测更新，更新包走 ghfast 加速下载
            - 侧边栏「反馈」改为 GitHub Issues 问题反馈
            - 关于页与设置页的检测更新均指向当前仓库
            - versionCode 121 → 122，versionName 2.4.10 → 2.4.11
          files: moxi.dongman.v2.4.11.apk
          token: ${{ secrets.GITHUB_TOKEN }}
